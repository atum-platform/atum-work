name: Atum Work archive

# Builds the Work runtime archive (macOS arm64) with the standard packer on a hosted runner,
# so it never depends on a developer Mac's free disk. Manual dispatch only; the artifact is
# short-lived and the desktop pins the archive by sha256 after the coordinator publishes it.
on:
  push:
    branches: ["feat/work-runtime-*"]
    paths: [".github/workflows/atum-work-archive.yml", "apps/**", "packages/**", "scripts/**", "atum-work/**", "native/**", "pnpm-lock.yaml"]
  workflow_dispatch:
    inputs:
      pin:
        description: Upstream stable tag the fork is based on
        default: v0.1.11
        required: true
      version:
        description: Work runtime version to stamp
        default: v0.1.12
        required: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install locked web, server and scripts dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/oxlint-plugin-t3code...
      - name: Fetch the Node LICENSE for the embedded Node version
        run: |
          node_version="$(node -p 'require("./package.json").engines.node')"
          test "$(node -p process.versions.node)" = "$node_version"
          curl -fsSL "https://raw.githubusercontent.com/nodejs/node/v${node_version}/LICENSE" -o "$RUNNER_TEMP/NODE_LICENSE"
      - name: Build the archive
        run: node scripts/atum-work/build.mjs "${{ inputs.pin || 'v0.1.11' }}" atum-work/brand.json "$RUNNER_TEMP/NODE_LICENSE" "$RUNNER_TEMP/out" "${{ inputs.version || 'v0.1.12' }}"
      - name: Smoke-test the archive
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          archive="$(ls "$RUNNER_TEMP"/out/atum-work-*-darwin-arm64.tar.gz)"
          node scripts/atum-work/smoke.mjs "$archive" "Atum Work"
          shasum -a 256 "$archive" | tee "$RUNNER_TEMP/out/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atum-work-${{ inputs.version || 'v0.1.12' }}-darwin-arm64
          path: |
            ${{ runner.temp }}/out/atum-work-*-darwin-arm64.tar.gz
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 5
          if-no-files-found: error
